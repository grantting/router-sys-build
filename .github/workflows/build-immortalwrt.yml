name: Build Xwrt 
 
on:
  workflow_dispatch:
    inputs:
      version:
        description: '输入目标版本号（例如24.10.0）'
        required: true 
        default: '25.12.1'
      model_id:
        description: '选择机型ID'
        required: true 
        default: 'redmi_ax6-stock'
        type: choice 
        options:
          - redmi_ax6-stock 
          - qihoo_360t7
          - xiaomi_mi-router-3g
      packages:
        description: '选择要编译的包（用空格分隔）。注意: 25.x+ 使用 APK，opkg 及 kiddin9 包不兼容'
        required: false 
        default: 'luci-app-passwall luci-i18n-package-manager-zh-cn luci-i18n-firewall-zh-cn kmod-fs-ext4 kmod-usb-dwc3 kmod-usb3 kmod-tcp-bbr swconfig kmod-nft-tproxy kmod-nft-socket luci-app-vlmcsd luci-app-diskman luci-app-upnp luci-theme-argon luci-i18n-base-zh-cn' 
      rootfs_size:
        description: 'RootFS 分区大小（MB），默认 300'
        required: false
        default: '120'
      wifi_ssid:
        description: 'WiFi 名称前缀（自动添加 _2.4G / _5G 后缀）'
        required: false
        default: '康达姆机器人'
      wifi_password:
        description: 'WiFi 密码，至少8位'
        required: false
        default: '123*567890'

jobs:
  download-build:
    runs-on: ubuntu-22.04 
    steps:
      - name: Checkout 
        uses: actions/checkout@v6
 
      - name: Initialization Environment
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 python3-distutils

      - name: Install dependencies 
        run: bash  scripts/install-deps.sh  
 
      - name: Get Target Platform 
        id: get-target 
        run: bash  scripts/get-platform.sh  ${{ inputs.version  }} ${{ inputs.model_id  }}
 
      - name: Cache ImageBuilder
        id: cache-imagebuilder
        uses: actions/cache@v5
        with:
          path: immortalwrt-imagebuilder-*
          key: immortalwrt-imagebuilder-${{ inputs.version }}-${{ steps.get-target.outputs.target_platform_hyphen }}

      - name: Download and Extract ImageBuilder
        if: steps.cache-imagebuilder.outputs.cache-hit != 'true'
        run: bash  scripts/download-extract.sh  ${{ inputs.version  }} ${{ steps.get-target.outputs.target_platform_slash  }} ${{ steps.get-target.outputs.target_platform_hyphen  }}

      - name: Configure Repositories 
        run: bash scripts/config-repos.sh 
  
      - name: Apply custom WiFi settings
        env:
          WIFI_SSID: ${{ inputs.wifi_ssid }}
          WIFI_PASSWORD: ${{ inputs.wifi_password }}
        run: |
          python3 << 'PYEOF'
          import os
          ssid = os.environ['WIFI_SSID']
          password = os.environ['WIFI_PASSWORD']

          for filepath in ['files/etc/config/wireless', 'files/etc/uci-defaults/99-custom']:
              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()
              content = content.replace('康达姆机器人', ssid)
              content = content.replace('123*567890', password)
              with open(filepath, 'w', encoding='utf-8') as f:
                  f.write(content)
          PYEOF

      - name: Build Firmware
        run: |
          bash scripts/files-general.sh
          
          BUILDER_DIR=$(ls -d immortalwrt-imagebuilder-* 2>/dev/null | head -1)
          if [ -z "$BUILDER_DIR" ]; then
            echo "错误: 未找到 immortalwrt-imagebuilder-* 目录"
            exit 1
          fi
          
          cp -r files "$BUILDER_DIR"
          cd "$BUILDER_DIR" || exit 1
          
          make image PROFILE="${{ inputs.model_id  }}" PACKAGES="${{ inputs.packages  }}" FILES="files" ROOTFS_PARTSIZE=${{ inputs.rootfs_size  }} -j$(nproc)

      - name: Verify firmware
        run: |
          BUILDER_DIR=$(ls -d immortalwrt-imagebuilder-* 2>/dev/null | head -1)
          FIRMWARE_DIR="$BUILDER_DIR/bin/targets/${{ steps.get-target.outputs.target_platform_slash }}"
          echo "=== 编译产物 ==="
          ls -lh $FIRMWARE_DIR/ 2>/dev/null
          if ls $FIRMWARE_DIR/*.bin 1>/dev/null 2>&1 || ls $FIRMWARE_DIR/*.ubi 1>/dev/null 2>&1 || ls $FIRMWARE_DIR/*.img 1>/dev/null 2>&1; then
            echo "✓ 固件验证通过"
          else
            echo "✗ 未找到固件文件"
            exit 1
          fi
                    
      - name: Get timestamp 
        id: date
        run: 
          export TZ='Asia/Shanghai'

          echo "current_time=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
      
      - name: Upload firmware files (.bin/.ubi)
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ inputs.model_id  }}-${{ inputs.version  }}-${{ steps.date.outputs.current_time  }}
          retention-days: 10
          path: |
            immortalwrt-imagebuilder-*/bin/targets/${{ steps.get-target.outputs.target_platform_slash  }}/*
        # 注意: upload-artifact 的 path 支持 glob，此处保留通配符以匹配目录
